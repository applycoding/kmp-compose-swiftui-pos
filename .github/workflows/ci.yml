name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared module tests (JVM + Android host)
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest
      - name: Android unit, Compose UI (Robolectric) and screenshot tests
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest -Proborazzi.test.record=true
      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            androidApp/screenshots
            androidApp/build/outputs/roborazzi
            androidApp/build/reports/tests
            androidApp/build/outputs/apk/debug/*.apk
